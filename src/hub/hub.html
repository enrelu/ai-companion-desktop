<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Companion - Hub</title>
  <link rel="stylesheet" href="./hub.css">
</head>
<body>
  <div class="hub-container" id="hubApp">
    <!-- Barra Superior -->
    <header class="hub-nav">
      <div class="hub-brand">
        <span>⚡ AI Companion</span>
      </div>
      <div class="hub-nav-controls">
        <div class="hub-nav-tabs">
          <button class="hub-nav-btn active" data-tab="history">📋 Historial</button>
          <button class="hub-nav-btn" data-tab="settings">⚙️ Ajustes</button>
        </div>
        <button class="hub-theme-btn" id="themeToggleBtn" title="Alternar Modo Claro / Oscuro">🌙</button>
      </div>
    </header>

    <!-- Panel 1: Historial del Portapapeles (20 slots + Pines) -->
    <main class="hub-panel active" id="tabHistory">
      <!-- Buscador -->
      <div class="hub-search-wrapper">
        <input type="text" class="hub-search-input" id="searchInput" placeholder="Buscar en el portapapeles reciente..." autofocus>
      </div>

      <!-- Sección de Pines Fijos -->
      <section class="hub-pinned-section">
        <div class="hub-section-title">
          <span>Pines Frecuentes (📌)</span>
          <span style="font-size:10.5px; color:var(--accent-color); font-weight:600;">Pegar en cualquier app con Alt+1, Alt+2, Alt+3, Alt+4</span>
        </div>
        <div class="hub-pinned-grid" id="pinnedContainer">
          <!-- Pines renderizados dinámicamente -->
        </div>
      </section>

      <!-- Lista de Historial (20 slots) -->
      <div class="hub-section-title">
        <span>Últimos Copiados (Máx. 20)</span>
        <button id="clearHistoryBtn" style="background:transparent; border:none; color:var(--accent-red); font-size:11px; cursor:pointer;">Limpiar</button>
      </div>
      <div class="hub-history-list" id="historyContainer">
        <!-- Elementos del historial renderizados dinámicamente -->
      </div>
    </main>

    <!-- Panel 2: Ajustes y Configuración -->
    <section class="hub-panel" id="tabSettings">
      <div class="hub-settings-content">
        <!-- API Key -->
        <div class="hub-form-group">
          <label class="hub-form-label">Gemini API Key</label>
          <div class="hub-form-desc">Obtén tu clave gratuita en <a href="https://aistudio.google.com/" target="_blank" style="color:var(--accent-color);">Google AI Studio</a>.</div>
          <input type="password" class="hub-form-input" id="apiKeyInput" placeholder="AIzaSy...">
        </div>

        <!-- Modelo -->
        <div class="hub-form-group">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label class="hub-form-label">Modelo de Gemini (Generación de Texto)</label>
            <span style="font-size:11px; color:var(--text-sub);">Requiere comprobar</span>
          </div>
          <div style="display:flex; gap:8px;">
            <select class="hub-form-select" id="modelSelect" style="flex:1;">
              <option value="" disabled selected>⚠️ Pulsa "Comprobar" para cargar los modelos disponibles...</option>
            </select>
            <button class="hub-mini-btn" id="checkModelsBtn" style="padding:0 14px; font-weight:600;">🔍 Comprobar</button>
          </div>
          <div id="modelsStatus" style="font-size:11.5px; color:var(--text-muted); display:none; margin-top:4px;"></div>
          <!-- Tarjeta de Límites y Cuotas de API -->
          <div id="modelLimitsCard" class="hub-model-limits-card" style="display:none;"></div>
        </div>

        <!-- Tema Visual -->
        <div class="hub-form-group">
          <label class="hub-form-label">Tema Visual</label>
          <select class="hub-form-select" id="themeSelect">
            <option value="dark">Modo Oscuro</option>
            <option value="light">Modo Claro</option>
            <option value="system">Sistema (Sigue a Windows)</option>
          </select>
        </div>

        <!-- Tono por Defecto -->
        <div class="hub-form-group">
          <label class="hub-form-label">Tono de Traducción Predeterminado</label>
          <select class="hub-form-select" id="toneSelect">
            <option value="professional">Profesional (Formal / Trabajo)</option>
            <option value="casual">Casual (Conversacional / Chat)</option>
            <option value="concise">Conciso (Directo / Breve)</option>
          </select>
        </div>

        <!-- Auto Reemplazo -->
        <div class="hub-form-group">
          <label class="hub-form-checkbox">
            <input type="checkbox" id="autoReplaceCheck">
            <span><strong>Auto-reemplazar selección:</strong> Sustituye automáticamente el texto seleccionado con la traducción en la ventana activa.</span>
          </label>
        </div>

        <!-- Modo Presentación / Compartir pantalla -->
        <div class="hub-form-group">
          <label class="hub-form-checkbox">
            <input type="checkbox" id="presentationModeCheck">
            <span><strong>Modo Oculto / Compartir Pantalla:</strong> Pausa la aparición de ventanas emergentes para evitar mostrar historiales durante reuniones.</span>
          </label>
        </div>

        <!-- Iniciar con Windows -->
        <div class="hub-form-group">
          <label class="hub-form-checkbox">
            <input type="checkbox" id="autostartCheck">
            <span><strong>Iniciar con Windows:</strong> Inicia automáticamente el asistente en segundo plano al encender el equipo.</span>
          </label>
        </div>

        <!-- Guardar -->
        <button class="hub-save-btn" id="saveSettingsBtn">Guardar Ajustes</button>
        <span id="saveStatus" style="font-size:12px; color:var(--accent-green); display:none;">¡Ajustes guardados correctamente!</span>
      </div>
    </section>
  </div>

  <script type="module" src="./hub.ts"></script>
</body>
</html>
